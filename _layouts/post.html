<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{{ page.title }} | RAIN's Blog</title>
        <link rel="stylesheet" href="/assets/css/index.css">
        <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
        <link rel="icon" type="image/png" href="/assets/images/favicon.png">
        <link rel="apple-touch-icon" href="/assets/images/favicon.png">
        <script type="module">
            import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            mermaid.initialize({
                startOnLoad: false,
                securityLevel: 'strict',
                ...(prefersDark ? {
                    theme: 'base',
                    themeVariables: {
                        darkMode: true,
                        background: '#01242e',
                        primaryColor: '#123a43',
                        primaryTextColor: '#eeeeee',
                        primaryBorderColor: '#8cc2dd',
                        lineColor: '#8cc2dd',
                        textColor: '#eeeeee',
                        nodeTextColor: '#eeeeee',
                        edgeLabelBackground: '#01242e',
                        secondaryColor: '#16434d',
                        tertiaryColor: '#0d3039',
                        fontFamily: 'Verdana, sans-serif'
                    }
                } : {})
            });
            document.addEventListener('DOMContentLoaded', async () => {
                document.querySelectorAll('pre code.language-mermaid').forEach((code) => {
                    const diagram = document.createElement('div');
                    diagram.className = 'mermaid';
                    diagram.textContent = code.textContent;
                    code.closest('.language-mermaid')?.replaceWith(diagram);
                });
                await mermaid.run({ querySelector: '.mermaid' });
            });
        </script>
    </head>
    <body>
        <header>
            <a class="title" href="/">
                <h1>
                    RAIN's Blog
                </h1>
            </a>
            <nav>
                <p><a href='/'>Home</a> <a href='/projects'>Projects</a> <a href='/books'>Books</a> <a href='/rocks'>Rocks!</a> </p>
            </nav>
        </header>

        <main>
            {{ content }}
        </main>
        <footer>
            <p>Subscribe via <a href='/feed'>rss</a> or just say <a href='/contact'>hello</a>.</p>
        </footer>
    </body>
</html>
